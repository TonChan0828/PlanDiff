name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 依存の脆弱性を最速で落とす(S-1)。閾値をhighに置くのは、moderateまで含めると
      # 常時赤になりCIが「無視されるチェック」に退化するため。
      # 新規Advisoryで無関係なPRが落ちた場合は、そのPRで直さず別途更新タスクを立てる
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
