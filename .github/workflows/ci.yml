name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Share a group across updates to each PR, but keep every main push separate.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 依存の脆弱性を最速で落とす(S-1)。閾値をhighに置くのは、moderateまで含めると
      # 常時赤になりCIが「無視されるチェック」に退化するため。
      # 新規Advisoryで無関係なPRが落ちた場合は、そのPRで直さず別途更新タスクを立てる
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      # 依存方向・循環と、未使用/未宣言の npm パッケージ(G-110)
      - run: npm run check:deps
      - run: npm run check:packages
      - run: npm test
      - run: npm run build

  integration:
    name: Integration and migration tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.107.0
      - name: Start disposable local Supabase
        env:
          GOOGLE_CLIENT_ID: local-ci-client
          GOOGLE_CLIENT_SECRET: local-ci-secret
        run: >-
          supabase start
          --exclude edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector
      - name: Apply all migrations to the disposable database
        run: supabase db reset --local --no-seed
      - name: Verify local migration history parser
        run: node scripts/check-migration-history.mjs --local
      # マイグレーションとコミット済みの型がずれていたら落とす(G-114)。
      # 直すときは、ローカルで `npm run db:types` を実行して生成物をコミットする。
      - name: Verify generated database types are up to date
        shell: bash
        run: |
          npm run db:types
          if ! git diff --exit-code -- lib/supabase/database.types.ts; then
            echo "::error::lib/supabase/database.types.ts がマイグレーションと一致しません。npm run db:types を実行して差分をコミットしてください。" >&2
            exit 1
          fi
      - name: Export local-only Supabase settings
        shell: bash
        run: |
          supabase status --output env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'SUPABASE_DB_URL=%s\n' "$DB_URL"
          } >> "$GITHUB_ENV"
      - run: npm run test:integration

  e2e:
    name: Mobile browser tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Tokyo
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ORIGIN: "http://127.0.0.1:3000"
      PRO_INTEREST_HMAC_SECRET: "local-ci-only-security-test-secret-32-bytes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.107.0
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Start disposable local Supabase
        env:
          GOOGLE_CLIENT_ID: local-ci-client
          GOOGLE_CLIENT_SECRET: local-ci-secret
        run: >-
          supabase start
          --exclude edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector
      - name: Apply all migrations to the disposable database
        run: supabase db reset --local --no-seed
      - name: Export local-only Supabase settings
        shell: bash
        run: |
          supabase status --output env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'SUPABASE_DB_URL=%s\n' "$DB_URL"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
